# Bereinigen (Objekte entfernen) für die Fotos-App – neben Immich, nur CPU, höchstens 2 Kerne.
services:
  bereinigen:
    build: .
    container_name: immich_bereinigen
    restart: always
    ports: ["2285:2285"]
    environment:
      THREADS: "2"
    cpus: 2
    mem_limit: 3g
    networks: [immich]
networks:
  immich:
    name: immich_default
    external: true
